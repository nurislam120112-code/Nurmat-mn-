<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b">
<meta name="description" content="NURMAT_MN — Бишкекте жана онлайн үн жаздыруу. Студия звукозаписи в Бишкеке и онлайн.">
<title>NURMAT_MN — Үн жаздыруу студиясы</title>
<style>
:root{
  --blue:#087cf0;
  --bright:#48acff;
  --bg:#05070b;
  --surface:#0b111c;
  --line:#243044;
  --ink:#102849;
  --muted:#b7c6da;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
  margin:0;background:var(--bg);color:#fff;
  font-family:Arial,Helvetica,sans-serif;line-height:1.7;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bright);outline-offset:4px}
.wrap{width:min(1140px,90%);margin:auto}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(5,7,11,.97);border-bottom:1px solid var(--line);
}
.nav{
  min-height:80px;display:flex;align-items:center;
  justify-content:space-between;gap:20px;
}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.brand span{color:var(--bright)}
.nav-right,nav{display:flex;align-items:center;gap:22px}
nav{font-size:14px;font-weight:700}
.languages{display:flex;padding:4px;border:1px solid var(--line);border-radius:10px;gap:3px}
.languages button{
  background:transparent;color:#bfcee0;border:0;
  padding:8px 10px;border-radius:7px;font-size:13px;font-weight:700;
}
.languages button.active{background:var(--blue);color:#fff}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:49px;padding:13px 22px;border:1px solid transparent;
  border-radius:12px;background:var(--blue);color:white;
  font-weight:700;text-align:center;transition:background .2s;
}
.btn:hover{background:#0666ca}
.btn.outline{background:transparent;border-color:#405470;color:#fff}
.btn.outline:hover{background:#152033}
.nav .btn{min-height:43px;padding:10px 15px;font-size:14px}
.hero{padding:75px 0;background:radial-gradient(ellipse at 85% 30%,#092343 0,transparent 55%)}
.hero-grid,.two{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:start}
.hero-grid{align-items:center}
.eyebrow{
  color:var(--bright);font-size:13px;font-weight:800;
  letter-spacing:1.6px;text-transform:uppercase;margin:0 0 20px;
}
h1{
  font-size:clamp(42px,5.7vw,70px);line-height:1.1;
  letter-spacing:-2px;margin:0 0 25px;
}
h1 span{display:block}
h1 .accent{color:var(--bright)}
h2{font-size:clamp(30px,4vw,43px);line-height:1.23;letter-spacing:-1px;margin:0 0 20px}
h3{font-size:22px;line-height:1.4;margin:0 0 14px}
.lead{font-size:18px;color:var(--muted);line-height:1.85}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:27px}
.small{font-size:14px;color:var(--muted)}
.logo-box{
  aspect-ratio:1;background:#000;border:1px solid #263449;
  border-radius:26px;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 25px 70px #0006;
}
.logo-box img{width:100%;height:100%;object-fit:contain}
.logo-fallback{text-align:center;padding:25px}
.logo-fallback strong{font-size:32px}
.logo-fallback span{color:#00aeef}
.experience{
  position:relative;margin:-28px 22px 0;padding:20px 23px;
  background:white;color:var(--ink);border-radius:16px;
  display:flex;align-items:center;gap:20px;
}
.experience strong{font-size:44px;line-height:1;color:var(--blue)}
.experience b{display:block}
.experience small{font-size:13px;color:#60718a}
.strip{border-block:1px solid var(--line)}
.strip .wrap{
  display:flex;justify-content:space-between;gap:20px;
  padding:22px 0;font-size:14px;font-weight:700;
}
section{padding:75px 0}
.head{max-width:720px;margin-bottom:35px}
.head p:not(.eyebrow){color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  padding:27px;background:white;color:var(--ink);
  border:1px solid #dbe7f5;border-radius:20px;
  display:flex;flex-direction:column;
}
.card.featured{border:2px solid var(--blue);background:linear-gradient(#eaf4ff,white)}
.label{font-size:13px;font-weight:800;color:#0763c4;margin-bottom:18px}
.price{font-size:clamp(28px,3vw,36px);font-weight:900;line-height:1.3;letter-spacing:-1px;margin:5px 0 20px}
.price small{font-size:16px;font-weight:400;letter-spacing:0}
.card ul{padding-left:20px;color:#536780;flex:1;margin:0 0 25px}
.card li{margin:10px 0}
.card li::marker{color:var(--blue)}
.card .btn{width:100%;margin-top:auto}
.card .btn.outline{color:var(--ink);border-color:#cbdcee}
.card .btn.outline:hover{background:#edf5ff}
.rates{font-size:14px;border-top:1px solid #dbe7f5;padding-top:12px;margin-bottom:15px}
.rates div{display:flex;justify-content:space-between;gap:10px;margin:9px 0}
.rates b{white-space:nowrap}
.voice{
  background:#112443;border:1px solid #254368;border-radius:18px;
  padding:28px;margin-top:20px;display:flex;
  justify-content:space-between;align-items:center;gap:24px;
}
.voice h3{margin-bottom:5px}
.voice p{color:#bfd0e8;margin:0}
.voice .price{margin:0;white-space:nowrap}
.alt{background:var(--surface)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.step{border-top:2px solid #294568;padding-top:20px}
.step>b{color:var(--bright);font-size:14px}
.step h3{margin-top:15px}
.step p{color:var(--muted)}
.rule{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.num{
  flex-shrink:0;width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;background:#142f51;color:#64b8ff;font-weight:700;
}
.rule h3{font-size:18px;margin-bottom:7px}
.rule p{margin:0;color:var(--muted)}
.panel{
  background:white;color:var(--ink);border-radius:20px;padding:28px;
}
.panel+.panel{margin-top:20px}
.panel p,.panel li{color:#536780}
.panel li{margin:10px 0}
.notice{
  background:#11243c;border-left:3px solid var(--bright);
  border-radius:0 10px 10px 0;padding:18px 20px;
  color:#d9e8fa;font-size:15px;margin-top:23px;
}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border:1px solid #cbdcee;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
form{
  padding:30px;background:white;color:var(--ink);
  border-radius:22px;box-shadow:0 15px 50px #0003;
}
.field{margin-bottom:19px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
input,select,textarea{
  display:block;width:100%;min-width:0;padding:13px;
  border:1px solid #cbdbee;border-radius:10px;
  background:#fbfdff;color:var(--ink);font-size:16px;
}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .btn{width:100%}
.form-note{font-size:13px;color:#60718a;margin-bottom:0}
#status{font-size:14px;color:#a53122}
.phone{display:inline-block;font-size:26px;font-weight:800;margin-top:20px}
.social{display:inline-block;color:var(--bright);font-weight:700;margin-top:15px}
.address-card{padding:30px;border:1px solid var(--line);border-radius:20px;background:#101b2b}
.address{font-size:22px;font-weight:700}
.faq{max-width:800px;margin:auto}
details{padding:22px 0;border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-size:18px;font-weight:700;line-height:1.5}
details p{color:var(--muted);margin-bottom:0}
footer{background:#030509;border-top:1px solid var(--line);padding:35px 0}
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:25px}
footer p{font-size:14px;color:var(--muted)}
@media(max-width:1000px){
  nav{display:none}
  .cards{grid-template-columns:1fr}
  .hero-grid{gap:30px}
}
@media(max-width:750px){
  .hero-grid,.two,.steps{grid-template-columns:1fr;gap:30px}
  .hero{padding:43px 0}
  .hero-art{max-width:460px;width:100%;margin:auto}
  section{padding:55px 0}
  .strip .wrap{flex-wrap:wrap;justify-content:center;gap:10px 20px;font-size:13px}
  .voice,.footer-row{flex-direction:column;align-items:flex-start}
  .panel,form,.address-card{padding:24px}
  h1{letter-spacing:-1.5px}
}
@media(max-width:420px){
  .brand{font-size:22px}
  .nav{gap:10px;min-height:72px}
  .languages button{padding:8px}
  .row{grid-template-columns:1fr;gap:0}
  .experience{margin:-25px 13px 0;padding:17px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>

  waIntro:"Обращаюсь по поводу записи с сайта NURMAT_MN.",
  waName:"Меня зовут",
  waDate:"Желаемая дата",
  waEnd:"Подскажите точную стоимость, свободное время и срок готовности.",
  clarify:"Уточним при обсуждении",
  none:"Нет"
}
};

let currentLanguage = "ky";

try {
  const savedLanguage = localStorage.getItem("nurmat-language");
  if (savedLanguage === "ky" || savedLanguage === "ru") {
    currentLanguage = savedLanguage;
  }
} catch (error) {}

function setLanguage(language) {
  if (!translations[language]) return;
  currentLanguage = language;
  const text = translations[language];

  document.documentElement.lang = language;
  document.title = text.title;

  document.querySelectorAll("[data-i]").forEach(function(element) {
    const key = element.dataset.i;
    if (text[key] !== undefined) element.textContent = text[key];
  });

  document.querySelectorAll("[data-placeholder]").forEach(function(element) {
    element.placeholder = text[element.dataset.placeholder];
  });

  document.querySelectorAll("[data-lang]").forEach(function(button) {
    const selected = button.dataset.lang === language;
    button.classList.toggle("active", selected);
    button.setAttribute("aria-pressed", String(selected));
  });

  const status = document.getElementById("status");
  if (!status.hidden) status.textContent = text.errorName;

  try {
    localStorage.setItem("nurmat-language", language);
  } catch (error) {}
}

document.querySelectorAll("[data-lang]").forEach(function(button) {
  button.addEventListener("click", function() {
    setLanguage(button.dataset.lang);
  });
});

document.querySelectorAll("[data-package]").forEach(function(link) {
  link.addEventListener("click", function() {
    document.getElementById("package").value = link.dataset.package;
  });
});

document.getElementById("year").textContent = new Date().getFullYear();
setLanguage(currentLanguage);

document.getElementById("orderForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const text = translations[currentLanguage];
  const nameInput = document.getElementById("customer");
  const name = nameInput.value.trim();
  const status = document.getElementById("status");

  if (!name) {
    status.hidden = false;
    status.textContent = text.errorName;
    nameInput.focus();
    return;
  }

  const packageSelect = document.getElementById("package");
  const formatSelect = document.getElementById("format");
  const selectedPackage = packageSelect.options[packageSelect.selectedIndex].textContent;
  const selectedFormat = formatSelect.options[formatSelect.selectedIndex].textContent;
  const rawDate = document.getElementById("date").value;
  const song = document.getElementById("song").value.trim();
  const message = document.getElementById("message").value.trim();

  let dateText = text.clarify;
  if (rawDate) {
    const parts = rawDate.split("-");
    dateText = parts[2] + "." + parts[1] + "." + parts[0];
  }

  const content = [
    text.waHello,
    text.waIntro,
    "",
    text.waName + ": " + name,
    text.packageLabel + ": " + selectedPackage,
    text.formatLabel + ": " + selectedFormat,
    text.waDate + ": " + dateText,
    text.songLabel + ": " + (song || text.clarify),
    text.messageLabel + ": " + (message || text.none),
    "",
    text.waEnd
  ].join("\n");

  status.hidden = true;
  window.location.href =
    "https://wa.me/996509202620?text=" + encodeURIComponent(content);
});
</script>
</body>
</html>
